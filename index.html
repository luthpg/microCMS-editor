<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>microCMS Mobile Editor</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .safe-bottom {
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* モバイルでのズーム防止: input/textarea は最低16px (text-base) */
    input, textarea, select {
      font-size: 16px !important;
    }
    /* Rich Text Preview HTML Styling */
    .html-preview-content {
      font-size: 15px;
      line-height: 1.6;
      color: #334155;
    }
    .html-preview-content h1 { font-size: 1.5em; font-weight: bold; margin-bottom: 0.5em; }
    .html-preview-content h2 { font-size: 1.3em; font-weight: bold; margin-bottom: 0.5em; }
    .html-preview-content h3 { font-size: 1.1em; font-weight: bold; margin-bottom: 0.5em; }
    .html-preview-content p { margin-bottom: 0.75em; }
    .html-preview-content ul { list-style-type: disc; padding-left: 1.2em; margin-bottom: 0.75em; }
    .html-preview-content ol { list-style-type: decimal; padding-left: 1.2em; margin-bottom: 0.75em; }
    .html-preview-content img { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 0.5rem 0; }
    .html-preview-content a { color: #4f46e5; text-decoration: underline; }
    .html-preview-content blockquote { border-left: 4px solid #e2e8f0; padding-left: 0.75rem; color: #64748b; font-style: italic; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col h-screen overflow-hidden font-sans">

  <!-- Header -->
  <header class="bg-indigo-600 text-white px-5 py-4 flex items-center justify-between shadow-md z-10 flex-shrink-0">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-paper-plane text-xl"></i>
      <h1 class="font-bold text-lg tracking-wide">microCMS Mobile</h1>
    </div>
    <button id="btn-settings" class="p-2.5 rounded-full hover:bg-indigo-700 transition active:scale-95 text-indigo-100">
      <i class="fa-solid fa-gear text-lg"></i>
    </button>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 overflow-y-auto px-4 py-5 space-y-5 no-scrollbar" id="main-content">

    <!-- Setup Banner -->
    <div id="setup-banner" class="bg-white rounded-3xl p-7 shadow-sm border border-indigo-100 text-center space-y-4 my-auto max-w-md mx-auto">
      <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center mx-auto text-indigo-600">
        <i class="fa-solid fa-sliders text-2xl"></i>
      </div>
      <div class="space-y-1.5">
        <h2 class="font-bold text-slate-800 text-lg">API接続設定が必要です</h2>
        <p class="text-xs text-slate-500 leading-relaxed">右上の設定ボタンから サービスDomain、API Key、エンドポイント名を入力してください。</p>
      </div>
      <button onclick="openSettingsModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl text-base shadow-md active:scale-98 transition">
        設定を開く
      </button>
    </div>

    <!-- Content List Container -->
    <div id="content-container" class="hidden space-y-4 max-w-2xl mx-auto">
      <!-- Search & Create Header -->
      <div class="flex items-center justify-between gap-3">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-base"></i>
          <input type="text" id="search-input" placeholder="タイトルやIDで検索..." class="w-full pl-11 pr-4 py-3.5 bg-white rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
        </div>
        <button id="btn-create" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3.5 rounded-2xl font-bold flex items-center gap-2 shadow-md active:scale-95 transition whitespace-nowrap text-base">
          <i class="fa-solid fa-plus"></i>
          <span>新規</span>
        </button>
      </div>

      <!-- Item Cards List -->
      <div id="items-list" class="space-y-4 pb-24">
        <!-- JS-driven content -->
      </div>
    </div>

  </main>

  <!-- Settings Modal -->
  <div id="modal-settings" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden transition-opacity">
    <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 sm:p-7 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b pb-4">
        <h2 class="font-bold text-slate-800 text-lg">microCMS 接続設定</h2>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 p-2 -mr-2">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <div class="space-y-4">
        <div class="space-y-1.5">
          <label class="block font-medium text-slate-700 text-sm">サービス Domain</label>
          <div class="flex items-center border border-slate-300 rounded-2xl px-4 py-3 bg-slate-50 focus-within:bg-white focus-within:ring-2 focus-within:ring-indigo-500">
            <input type="text" id="cfg-domain" placeholder="your-service" class="w-full bg-transparent focus:outline-none">
            <span class="text-slate-400 text-xs ml-1 flex-shrink-0">.microcms.io</span>
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="block font-medium text-slate-700 text-sm">API Key</label>
          <input type="password" id="cfg-apikey" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" class="w-full border border-slate-300 rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="space-y-1.5">
          <label class="block font-medium text-slate-700 text-sm">エンドポイント名 (API ID)</label>
          <input type="text" id="cfg-endpoint" placeholder="blogs や news など" class="w-full border border-slate-300 rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div class="pt-2">
        <button onclick="saveSettings()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-md active:scale-98 transition text-base">
          設定を保存してデータを取得
        </button>
      </div>
    </div>
  </div>

  <!-- Editor Modal -->
  <div id="modal-editor" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden">
    <div class="bg-white w-full sm:max-w-xl rounded-t-3xl sm:rounded-3xl p-5 sm:p-7 shadow-2xl flex flex-col h-[94vh] sm:h-[88vh]">
      
      <!-- Editor Header -->
      <div class="flex items-center justify-between border-b pb-4 flex-shrink-0">
        <div class="flex items-center space-x-2.5">
          <span id="editor-title" class="font-bold text-slate-800 text-lg">記事の編集</span>
          <span id="editor-status-badge" class="px-2.5 py-1 text-xs rounded-full font-semibold bg-slate-100 text-slate-600">NEW</span>
        </div>
        <button onclick="closeEditorModal()" class="text-slate-400 hover:text-slate-600 p-2 -mr-2">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- Dynamic Form Fields -->
      <div id="editor-fields" class="flex-1 overflow-y-auto py-5 space-y-6 no-scrollbar">
        <!-- JS-driven inputs -->
      </div>

      <!-- Editor Footer Actions -->
      <div class="border-t pt-4 flex items-center justify-between gap-3 flex-shrink-0 safe-bottom">
        <button id="btn-delete" onclick="deleteContent()" class="text-rose-600 bg-rose-50 hover:bg-rose-100 px-4 py-3.5 rounded-2xl font-bold flex items-center gap-1.5 active:scale-95 transition text-sm">
          <i class="fa-solid fa-trash-can"></i>
          <span>削除</span>
        </button>

        <div class="flex items-center gap-2.5 flex-1 justify-end">
          <button onclick="saveContent(true)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-3.5 rounded-2xl text-sm active:scale-95 transition">
            下書き保存
          </button>
          <button onclick="saveContent(false)" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-3.5 rounded-2xl text-sm shadow-md active:scale-95 transition">
            公開する
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900/95 backdrop-blur-md text-white text-sm px-5 py-3.5 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-3 max-w-[90vw]">
    <i id="toast-icon" class="fa-solid fa-circle-info text-indigo-400"></i>
    <span id="toast-msg" class="truncate">メッセージ</span>
  </div>

  <script>
    // --- IndexedDB DB Manager ---
    const DB_NAME = 'MicroCMSMobileDB';
    const STORE_NAME = 'configStore';

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getStoredConfig() {
      try {
        const db = await initDB();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.get('mc_config');
          req.onsuccess = () => {
            if (req.result) {
              resolve(req.result);
            } else {
              resolve(getLocalStorageConfig());
            }
          };
          req.onerror = () => resolve(getLocalStorageConfig());
        });
      } catch (e) {
        return getLocalStorageConfig();
      }
    }

    function getLocalStorageConfig() {
      return {
        domain: localStorage.getItem('mc_domain') || '',
        apiKey: localStorage.getItem('mc_apikey') || '',
        endpoint: localStorage.getItem('mc_endpoint') || ''
      };
    }

    async function saveStoredConfig(cfg) {
      localStorage.setItem('mc_domain', cfg.domain);
      localStorage.setItem('mc_apikey', cfg.apiKey);
      localStorage.setItem('mc_endpoint', cfg.endpoint);

      try {
        const db = await initDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put(cfg, 'mc_config');
      } catch (e) {
        console.warn('IndexedDB save failed, fallback to localStorage', e);
      }
    }

    // --- State Management ---
    let config = { domain: '', apiKey: '', endpoint: '' };
    let itemsData = [];
    let currentEditingItem = null;
    let isCreating = false;

    // --- DOM Elements ---
    const setupBanner = document.getElementById('setup-banner');
    const contentContainer = document.getElementById('content-container');
    const itemsList = document.getElementById('items-list');
    const searchInput = document.getElementById('search-input');

    const modalSettings = document.getElementById('modal-settings');
    const modalEditor = document.getElementById('modal-editor');

    // --- Core Initializer ---
    window.onload = async () => {
      config = await getStoredConfig();

      if (config.domain && config.apiKey && config.endpoint) {
        fetchContents();
      } else {
        openSettingsModal();
      }

      document.getElementById('btn-settings').addEventListener('click', openSettingsModal);
      document.getElementById('btn-create').addEventListener('click', () => openEditorModal());
      searchInput.addEventListener('input', filterItems);
    };

    // --- MicroCMS API Handler ---
    async function fetchContents() {
      if (!config.domain || !config.apiKey || !config.endpoint) return;

      showToast('データを取得中...', 'fa-spinner fa-spin');

      try {
        const url = `https://${config.domain}.microcms.io/api/v1/${config.endpoint}?draftKey=1&limit=50`;
        const res = await fetch(url, {
          headers: { 'X-MICROCMS-API-KEY': config.apiKey }
        });

        if (!res.ok) throw new Error(`エラー (${res.status})`);

        const data = await res.json();
        itemsData = data.contents || [];

        setupBanner.classList.add('hidden');
        contentContainer.classList.remove('hidden');

        renderList(itemsData);
        showToast('取得が完了しました', 'fa-check text-emerald-400');
      } catch (err) {
        console.error(err);
        showToast(`取得失敗: ${err.message}`, 'fa-triangle-exclamation text-rose-400');
      }
    }

    // --- Format Objects / Relations ---
    function formatRelationValue(val) {
      if (val === null || val === undefined) return '';

      if (Array.isArray(val)) {
        if (val.length === 0) return '（なし）';
        return val.map(v => formatRelationValue(v)).join(', ');
      }

      if (typeof val === 'object') {
        if (val.url) return `[画像]`;
        if (val.name) return val.name;
        if (val.title) return val.title;
        if (val.id) return val.id;
        return JSON.stringify(val);
      }

      return String(val);
    }

    // オブジェクトからID文字列またはID配列を抽出（microCMS保存用）
    function cleanRelationData(data) {
      if (!data) return null;

      if (Array.isArray(data)) {
        return data.map(item => cleanRelationData(item)).filter(Boolean);
      }

      if (typeof data === 'object') {
        if (data.id) return data.id; // 単一参照はID文字列を返す
        return null;
      }

      if (typeof data === 'string') return data.trim();

      return data;
    }

    // --- UI Rendering ---
    function renderList(list) {
      itemsList.innerHTML = '';

      if (list.length === 0) {
        itemsList.innerHTML = `
          <div class="text-center py-16 text-slate-400 bg-white rounded-3xl border border-slate-200/60 p-6">
            <i class="fa-regular fa-folder-open text-4xl mb-3 text-slate-300"></i>
            <p class="text-sm font-medium">コンテンツが見つかりません</p>
          </div>
        `;
        return;
      }

      list.forEach(item => {
        const title = item.title || item.name || item.id || '無題';
        const updatedAt = new Date(item.updatedAt || Date.now()).toLocaleDateString('ja-JP', {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        let previewText = item.content || item.body || item.description || '';
        if (typeof previewText === 'object') {
          previewText = formatRelationValue(previewText);
        } else {
          previewText = previewText.replace(/<[^>]*>?/gm, '').substring(0, 80);
        }

        const relationBadges = [];
        Object.keys(item).forEach(k => {
          if (['id', 'title', 'name', 'content', 'body', 'createdAt', 'updatedAt', 'publishedAt', 'revisedAt'].includes(k)) return;
          const v = item[k];
          if (typeof v === 'object' && v !== null && !v.url) {
            const label = formatRelationValue(v);
            if (label && label !== '（なし）') {
              relationBadges.push({ key: k, value: label });
            }
          }
        });

        const card = document.createElement('div');
        card.className = 'bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-200/80 active:scale-98 transition cursor-pointer relative space-y-3 hover:border-indigo-200';
        card.onclick = () => openEditorModal(item);

        card.innerHTML = `
          <div class="flex items-start justify-between gap-3">
            <h3 class="font-bold text-slate-800 text-base sm:text-lg line-clamp-1 flex-1 leading-snug">${escapeHtml(title)}</h3>
            <span class="text-xs bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full font-bold flex-shrink-0 border border-indigo-100">
              ${escapeHtml(item.id)}
            </span>
          </div>

          ${previewText ? `<p class="text-xs sm:text-sm text-slate-500 line-clamp-2 leading-relaxed">${escapeHtml(previewText)}</p>` : ''}

          ${relationBadges.length > 0 ? `
            <div class="flex flex-wrap gap-1.5 pt-1">
              ${relationBadges.map(b => `
                <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg font-medium inline-flex items-center gap-1 border border-slate-200/60">
                  <span class="text-slate-400">${escapeHtml(b.key)}:</span>
                  <span class="truncate max-w-[130px]">${escapeHtml(b.value)}</span>
                </span>
              `).join('')}
            </div>
          ` : ''}

          <div class="flex items-center justify-between pt-3 text-xs text-slate-400 border-t border-slate-100">
            <span class="flex items-center gap-1.5"><i class="fa-regular fa-clock"></i>${updatedAt}</span>
            <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
          </div>
        `;

        itemsList.appendChild(card);
      });
    }

    function filterItems() {
      const q = searchInput.value.toLowerCase().trim();
      if (!q) {
        renderList(itemsData);
        return;
      }

      const filtered = itemsData.filter(item => {
        const title = (item.title || item.name || '').toLowerCase();
        const id = item.id.toLowerCase();
        return title.includes(q) || id.includes(q);
      });

      renderList(filtered);
    }

    // --- Dynamic Editor Form Generator ---
    function openEditorModal(item = null) {
      currentEditingItem = item;
      isCreating = !item;

      const titleEl = document.getElementById('editor-title');
      const badgeEl = document.getElementById('editor-status-badge');
      const deleteBtn = document.getElementById('btn-delete');
      const fieldsContainer = document.getElementById('editor-fields');

      fieldsContainer.innerHTML = '';

      if (isCreating) {
        titleEl.textContent = '新規コンテンツ';
        badgeEl.textContent = '新規';
        badgeEl.className = 'px-3 py-1 text-xs rounded-full font-bold bg-emerald-100 text-emerald-700';
        deleteBtn.classList.add('hidden');
      } else {
        titleEl.textContent = 'コンテンツ編集';
        badgeEl.textContent = item.id;
        badgeEl.className = 'px-3 py-1 text-xs rounded-full font-bold bg-indigo-100 text-indigo-700';
        deleteBtn.classList.remove('hidden');
      }

      const sampleObj = item || (itemsData.length > 0 ? itemsData[0] : { title: '', content: '' });
      const ignoreKeys = ['createdAt', 'updatedAt', 'publishedAt', 'revisedAt'];

      Object.keys(sampleObj).forEach(key => {
        if (ignoreKeys.includes(key)) return;

        const val = item ? item[key] : '';
        const fieldGroup = document.createElement('div');
        fieldGroup.className = 'space-y-2 bg-slate-50 p-4 rounded-2xl border border-slate-200/70';

        const label = document.createElement('label');
        label.className = 'block font-bold text-slate-700 text-xs tracking-wider uppercase flex items-center justify-between';
        label.innerHTML = `<span>${key}</span>`;

        // 1. ID Field (Create mode only)
        if (key === 'id') {
          if (!isCreating) return;
          const input = document.createElement('input');
          input.type = 'text';
          input.name = key;
          input.placeholder = 'カスタムID（指定しない場合は自動生成）';
          input.className = 'w-full border border-slate-300 rounded-2xl px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500';
          fieldGroup.appendChild(label);
          fieldGroup.appendChild(input);
          fieldsContainer.appendChild(fieldGroup);
          return;
        }

        // 2. Boolean Field
        if (typeof val === 'boolean') {
          const checkWrap = document.createElement('div');
          checkWrap.className = 'flex items-center space-x-3 pt-1';
          const input = document.createElement('input');
          input.type = 'checkbox';
          input.name = key;
          input.checked = !!val;
          input.className = 'w-6 h-6 text-indigo-600 rounded-lg border-slate-300 focus:ring-indigo-500';
          checkWrap.appendChild(input);
          checkWrap.appendChild(document.createElement('span')).textContent = '有効 (True)';
          checkWrap.lastChild.className = 'text-sm text-slate-700 font-medium';
          fieldGroup.appendChild(label);
          fieldGroup.appendChild(checkWrap);
        } 
        // 3. Image Object Field
        else if (typeof val === 'object' && val !== null && !Array.isArray(val) && val.url) {
          label.innerHTML += `<span class="text-[10px] text-indigo-600 font-normal">画像 URL</span>`;
          const input = document.createElement('input');
          input.type = 'url';
          input.name = `${key}.url`;
          input.value = val.url || '';
          input.placeholder = 'https://images.microcms-assets.io/...';
          input.className = 'w-full border border-slate-300 rounded-2xl px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500';
          
          fieldGroup.appendChild(label);
          fieldGroup.appendChild(input);

          if (val.url) {
            const imgPrev = document.createElement('img');
            imgPrev.src = val.url;
            imgPrev.className = 'h-28 w-auto rounded-2xl object-cover mt-2 border border-slate-200 shadow-sm';
            fieldGroup.appendChild(imgPrev);
          }
        }
        // 4. Content Reference / Relation Field (Category / Tag / Custom Reference)
        else if (typeof val === 'object' && val !== null) {
          const isArr = Array.isArray(val);
          label.innerHTML += `<span class="text-[10px] text-indigo-600 font-normal">${isArr ? '参照項目 (複数)' : '参照項目 (単一)'}</span>`;

          // IDの抽出
          let extractedId = '';
          if (isArr) {
            extractedId = val.map(v => (typeof v === 'object' ? v.id : v)).join(', ');
          } else {
            extractedId = val.id || (typeof val === 'string' ? val : '');
          }

          const input = document.createElement('input');
          input.type = 'text';
          input.name = key;
          input.dataset.isRelation = "true";
          input.dataset.isArr = isArr ? "true" : "false";
          input.value = extractedId;
          input.placeholder = isArr ? '参照ID（カンマ区切り例: id1, id2）' : '参照ID（例: scdgmuz5nrl1）';
          input.className = 'w-full border border-slate-300 rounded-2xl px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono';

          const formattedLabel = formatRelationValue(val);
          const badgeNotice = document.createElement('div');
          badgeNotice.className = 'text-xs text-slate-600 bg-white px-3.5 py-2.5 rounded-xl border border-slate-200 flex items-start gap-2';
          badgeNotice.innerHTML = `<i class="fa-solid fa-link text-indigo-500 mt-0.5"></i> <span><strong class="font-semibold text-slate-700">参照名:</strong> ${escapeHtml(formattedLabel)}</span>`;

          fieldGroup.appendChild(label);
          fieldGroup.appendChild(badgeNotice);
          fieldGroup.appendChild(input);
        }
        // 5. Rich Text / HTML / Content Body Field (HTML Switcher)
        else if (key.toLowerCase().includes('content') || key.toLowerCase().includes('body') || (typeof val === 'string' && (val.includes('<') || val.length > 50))) {
          label.innerHTML += `<span class="text-[10px] text-indigo-600 font-normal">リッチテキスト / HTML</span>`;
          
          const tabContainer = document.createElement('div');
          tabContainer.className = 'flex border-b border-slate-200 space-x-4 mb-2';

          const btnCode = document.createElement('button');
          btnCode.type = 'button';
          btnCode.className = 'pb-2 border-b-2 border-indigo-600 text-indigo-600 font-bold text-xs flex items-center gap-1.5';
          btnCode.innerHTML = `<i class="fa-solid fa-code"></i> HTMLコード`;

          const btnPrev = document.createElement('button');
          btnPrev.type = 'button';
          btnPrev.className = 'pb-2 border-b-2 border-transparent text-slate-400 font-medium text-xs flex items-center gap-1.5 hover:text-slate-600';
          btnPrev.innerHTML = `<i class="fa-solid fa-eye"></i> プレビュー`;

          tabContainer.appendChild(btnCode);
          tabContainer.appendChild(btnPrev);

          const textarea = document.createElement('textarea');
          textarea.name = key;
          textarea.rows = 8;
          textarea.value = val || '';
          textarea.placeholder = `${key}（HTML / テキスト）を入力`;
          textarea.className = 'w-full border border-slate-300 rounded-2xl p-4 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono leading-relaxed';

          const previewDiv = document.createElement('div');
          previewDiv.className = 'w-full min-h-[200px] max-h-[350px] overflow-y-auto border border-slate-200 rounded-2xl p-4 bg-white hidden html-preview-content';
          previewDiv.innerHTML = val || '<span class="text-slate-400 italic">（内容がありません）</span>';

          btnCode.onclick = () => {
            btnCode.className = 'pb-2 border-b-2 border-indigo-600 text-indigo-600 font-bold text-xs flex items-center gap-1.5';
            btnPrev.className = 'pb-2 border-b-2 border-transparent text-slate-400 font-medium text-xs flex items-center gap-1.5 hover:text-slate-600';
            textarea.classList.remove('hidden');
            previewDiv.classList.add('hidden');
          };

          btnPrev.onclick = () => {
            btnPrev.className = 'pb-2 border-b-2 border-indigo-600 text-indigo-600 font-bold text-xs flex items-center gap-1.5';
            btnCode.className = 'pb-2 border-b-2 border-transparent text-slate-400 font-medium text-xs flex items-center gap-1.5 hover:text-slate-600';
            previewDiv.innerHTML = textarea.value.trim() || '<span class="text-slate-400 italic">（内容がありません）</span>';
            textarea.classList.add('hidden');
            previewDiv.classList.remove('hidden');
          };

          fieldGroup.appendChild(label);
          fieldGroup.appendChild(tabContainer);
          fieldGroup.appendChild(textarea);
          fieldGroup.appendChild(previewDiv);
        }
        // 6. Normal Text / Number Field
        else {
          const input = document.createElement('input');
          input.type = typeof val === 'number' ? 'number' : 'text';
          input.name = key;
          input.value = val !== undefined && val !== null ? val : '';
          input.placeholder = key;
          input.className = 'w-full border border-slate-300 rounded-2xl px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500';
          fieldGroup.appendChild(label);
          fieldGroup.appendChild(input);
        }

        fieldsContainer.appendChild(fieldGroup);
      });

      modalEditor.classList.remove('hidden');
    }

    function closeEditorModal() {
      modalEditor.classList.add('hidden');
    }

    // --- CRUD Actions ---
    async function saveContent(isDraft = false) {
      const fieldsContainer = document.getElementById('editor-fields');
      const inputs = fieldsContainer.querySelectorAll('input, textarea');
      const payload = {};
      let customId = null;

      try {
        inputs.forEach(el => {
          if (!el.name) return;

          if (el.name === 'id') {
            if (el.value.trim()) customId = el.value.trim();
            return;
          }

          // 関連参照フィールド (Category/Tag 等) のパース・整形
          if (el.dataset.isRelation === "true") {
            const rawVal = el.value.trim();
            const isArr = el.dataset.isArr === "true";

            if (!rawVal) {
              payload[el.name] = isArr ? [] : null;
            } else if (isArr) {
              payload[el.name] = rawVal.split(',').map(s => s.trim()).filter(Boolean);
            } else {
              payload[el.name] = rawVal; // 単一参照はID文字列そのものを指定
            }
            return;
          }

          // ネストオブジェクト (例: image.url)
          if (el.name.includes('.')) {
            const [parent, child] = el.name.split('.');
            payload[parent] = payload[parent] || {};
            payload[parent][child] = el.value;
          } else if (el.type === 'checkbox') {
            payload[el.name] = el.checked;
          } else if (el.type === 'number') {
            payload[el.name] = Number(el.value);
          } else {
            payload[el.name] = el.value;
          }
        });
      } catch (err) {
        showToast(err.message, 'fa-triangle-exclamation text-amber-400');
        return;
      }

      showToast(isDraft ? '下書きを保存中...' : '保存中...', 'fa-spinner fa-spin');

      try {
        let url = `https://${config.domain}.microcms.io/api/v1/${config.endpoint}`;
        let method = 'POST';

        if (!isCreating) {
          url += `/${currentEditingItem.id}`;
          method = 'PATCH';
        } else if (customId) {
          url += `/${customId}`;
          method = 'PUT';
        }

        if (isDraft) {
          url += (url.includes('?') ? '&' : '?') + 'status=draft';
        }

        const res = await fetch(url, {
          method: method,
          headers: {
            'X-MICROCMS-API-KEY': config.apiKey,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.message || `HTTPエラー ${res.status}`);
        }

        showToast(isDraft ? '下書きを保存しました' : '公開・保存が完了しました', 'fa-check text-emerald-400');
        closeEditorModal();
        fetchContents();
      } catch (err) {
        console.error(err);
        showToast(`保存エラー: ${err.message}`, 'fa-triangle-exclamation text-rose-400');
      }
    }

    async function deleteContent() {
      if (!currentEditingItem) return;

      if (!confirm(`コンテンツ [${currentEditingItem.id}] を削除しますか？`)) {
        return;
      }

      showToast('削除中...', 'fa-spinner fa-spin');

      try {
        const url = `https://${config.domain}.microcms.io/api/v1/${config.endpoint}/${currentEditingItem.id}`;
        const res = await fetch(url, {
          method: 'DELETE',
          headers: {
            'X-MICROCMS-API-KEY': config.apiKey
          }
        });

        if (!res.ok) throw new Error(`削除に失敗しました (${res.status})`);

        showToast('削除が完了しました', 'fa-check text-emerald-400');
        closeEditorModal();
        fetchContents();
      } catch (err) {
        console.error(err);
        showToast(`削除エラー: ${err.message}`, 'fa-triangle-exclamation text-rose-400');
      }
    }

    // --- Settings Modal Handler ---
    function openSettingsModal() {
      document.getElementById('cfg-domain').value = config.domain;
      document.getElementById('cfg-apikey').value = config.apiKey;
      document.getElementById('cfg-endpoint').value = config.endpoint;
      modalSettings.classList.remove('hidden');
    }

    function closeSettingsModal() {
      modalSettings.classList.add('hidden');
    }

    async function saveSettings() {
      const d = document.getElementById('cfg-domain').value.trim();
      const a = document.getElementById('cfg-apikey').value.trim();
      const e = document.getElementById('cfg-endpoint').value.trim();

      if (!d || !a || !e) {
        showToast('全ての項目を入力してください', 'fa-triangle-exclamation text-amber-400');
        return;
      }

      config.domain = d;
      config.apiKey = a;
      config.endpoint = e;

      await saveStoredConfig(config);

      closeSettingsModal();
      fetchContents();
    }

    // --- Helpers ---
    function showToast(msg, iconClass = 'fa-info-circle') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');

      toastMsg.textContent = msg;
      toastIcon.className = `fa-solid ${iconClass}`;

      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 3500);
    }

    function escapeHtml(str) {
      if (typeof str !== 'string') return str;
      return str.replace(/[&<>"']/g, match => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[match]);
    }
  </script>
</body>
